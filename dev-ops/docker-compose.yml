name: "{APP_NAME}"

services:
  app:
    image: "{IMAGE}"
    container_name: "{APP_NAME}"
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: "{ENV}"
    volumes:
      - ./application.properties:/app/config/application.properties
      - ./application-{ENV}.properties:/app/config/application-{ENV}.properties
      - "{LOG_DIR}:{LOG_DIR}"
      - "{UPLOAD_DIR}:{UPLOAD_DIR}"
